name: Apply Evaluation Tabs

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-evaluation-tabs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-evaluation-tabs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply evaluation tab patch
        shell: pwsh
        run: |
          .github/scripts/apply_evaluation_tabs_local.ps1

      - name: Verify markers
        shell: bash
        run: |
          grep -q "EvaluationTypeTable" lib/main.dart
          grep -q "Superior Evaluation" lib/main.dart
          grep -q "Peer-to-peer Evaluation" lib/main.dart
          grep -q "Self Evaluation" lib/main.dart
          grep -q "Student Evaluation" lib/main.dart

      - name: Commit patched main.dart
        shell: bash
        run: |
          if git diff --quiet -- lib/main.dart; then
            echo "No evaluation tab changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Apply evaluation tabs to module"
          git push
